name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/MicroService.Contracts.Events

      - name: Pack
        run: dotnet pack src/MicroService.Contracts.Events --configuration Release --output ./output

      - name: Push to GitHub Packages
        run: dotnet nuget push "./output/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.Nuget_GITHUB_TOKEN }} --skip-duplicate