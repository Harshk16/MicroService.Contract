name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find project file
        id: find-project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f -name "MicroService.Contracts.Events.csproj" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project not found"
            exit 1
          fi
          echo "project_file=$PROJECT_FILE" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.find-project.outputs.project_file }}"

      - name: Pack
        run: |
          dotnet pack "${{ steps.find-project.outputs.project_file }}" \
            --configuration Release \
            --output ./output \
            -p:PackageVersion=1.0.${{ github.run_number }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./output/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.Nuget_GITHUB_TOKEN }}" \
            --skip-duplicate